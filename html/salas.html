<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salas · BookMyLab</title>
  <meta name="description" content="BookMyLab: reserva laboratorios, salas y equipo del campus.">
  <script>try { const t = localStorage.getItem('bookmylab.tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
  try { if (!sessionStorage.getItem('bookmylab.intro')) { document.documentElement.dataset.intro = ''; sessionStorage.setItem('bookmylab.intro', '1'); } } catch {}</script>
  <meta name="theme-color" content="#161b33">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body data-protegida>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="barra">
    <div class="barra__interior">
      <a class="marca" href="/">
        <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <rect class="logo__fondo" width="32" height="32" rx="9"/>
          <rect class="logo__celda" x="7.5" y="7.5" width="7.5" height="7.5" rx="2"/>
          <rect class="logo__celda" x="17" y="7.5" width="7.5" height="7.5" rx="2"/>
          <rect class="logo__celda" x="7.5" y="17" width="7.5" height="7.5" rx="2"/>
          <rect class="logo__celda" x="17" y="17" width="7.5" height="7.5" rx="2"/>
          <rect class="logo__slot" x="16.3" y="16.3" width="8.9" height="8.9" rx="2.4"/>
          <path class="logo__check" d="M18.6 20.9l1.7 1.7 3-3.3"/>
        </svg>
        <span>BookMyLab</span>
      </a>
      <nav aria-label="Principal">
        <ul class="nav">
          <li><a href="/">Inicio</a></li>
          <li><a href="/reservas">Reservas</a></li>
          <li><a href="/salas" aria-current="page">Salas</a></li>
          <li data-roles="admin"><a href="/equipos">Equipos</a></li>
          <li data-roles="admin"><a href="/usuarios">Usuarios</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="contenido" class="contenedor">
    <div class="encabezado">
      <p class="eyebrow">Catálogo</p>
      <h1>Salas y laboratorios</h1>
      <p class="lead">Cada sala tiene su horario de servicio y su capacidad. Las reservas se validan contra ambos.</p>
    </div>

    <div class="crud">
      <section class="panel panel--form" aria-labelledby="titulo-form" data-roles="admin">
        <form id="form" novalidate>
          <div class="form-titulo"><h2 id="titulo-form" data-titulo>Nueva sala</h2></div>
          <div class="campos">
            <div class="campo campo--mitad">
              <label for="clave">Clave</label>
              <input id="clave" name="clave" required pattern="[A-Za-z0-9\-]{2,12}" maxlength="12" placeholder="LC-01" autocapitalize="characters" data-msg="De 2 a 12 letras, números o guiones">
              <p class="error" data-error-for="clave"></p>
            </div>
            <div class="campo campo--mitad">
              <label for="edificio">Edificio</label>
              <input id="edificio" name="edificio" required maxlength="20" placeholder="K" autocapitalize="characters">
              <p class="error" data-error-for="edificio"></p>
            </div>
            <div class="campo">
              <label for="nombre">Nombre</label>
              <input id="nombre" name="nombre" required minlength="3" maxlength="60" placeholder="Laboratorio de Cómputo 1">
              <p class="error" data-error-for="nombre"></p>
            </div>
            <div class="campo campo--mitad">
              <label for="tipo">Tipo</label>
              <select id="tipo" name="tipo" required></select>
              <p class="error" data-error-for="tipo"></p>
            </div>
            <div class="campo campo--mitad">
              <label for="capacidad">Capacidad</label>
              <input id="capacidad" name="capacidad" type="number" min="1" max="500" step="1" required inputmode="numeric">
              <p class="error" data-error-for="capacidad"></p>
            </div>
            <div class="campo campo--mitad">
              <label for="horaApertura">Abre</label>
              <input id="horaApertura" name="horaApertura" type="time" required value="07:00">
              <p class="error" data-error-for="horaApertura"></p>
            </div>
            <div class="campo campo--mitad">
              <label for="horaCierre">Cierra</label>
              <input id="horaCierre" name="horaCierre" type="time" required value="21:00">
              <p class="error" data-error-for="horaCierre"></p>
            </div>
            <div class="campo">
              <label for="descripcion">Descripción <span class="opcional">(opcional)</span></label>
              <textarea id="descripcion" name="descripcion" maxlength="200" placeholder="Equipamiento, reglas de uso…"></textarea>
              <p class="error" data-error-for="descripcion"></p>
            </div>
            <div class="campo">
              <label class="check"><input type="checkbox" name="disponible" checked> Disponible para reservar</label>
              <p class="error" data-error-for="disponible"></p>
            </div>
          </div>
          <div class="form__acciones">
            <button class="btn btn--primario" type="submit">Guardar sala</button>
            <button class="btn btn--fantasma" type="button" data-cancelar hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="t-lista">
        <div class="panel__cab"><h2 id="t-lista">Salas registradas</h2><span class="contador" data-contador></span></div>
        <form id="filtros" class="filtros" role="search" aria-label="Filtrar salas">
          <div class="campo"><label for="f-buscar">Buscar</label><input id="f-buscar" name="buscar" type="search" placeholder="Clave o nombre"></div>
          <div class="campo"><label for="f-tipo">Tipo</label><select id="f-tipo" name="tipo"></select></div>
          <div class="campo"><label for="f-edificio">Edificio</label><input id="f-edificio" name="edificio" placeholder="K" maxlength="20"></div>
          <div class="campo"><label for="f-capacidad">Capacidad mín.</label><input id="f-capacidad" name="capacidadMin" type="number" min="1" inputmode="numeric"></div>
          <div class="campo"><label for="f-disponible">Estado</label>
            <select id="f-disponible" name="disponible"><option value="">Todas</option><option value="true">Disponibles</option><option value="false">No disponibles</option></select>
          </div>
          <div class="campo"><label for="f-orden">Ordenar por</label>
            <select id="f-orden" name="orden"><option value="clave">Clave</option><option value="nombre">Nombre</option><option value="-capacidad">Mayor capacidad</option><option value="capacidad">Menor capacidad</option></select>
          </div>
        </form>
        <div class="tabla-envoltura">
          <table class="tabla">
            <thead><tr><th>Sala</th><th>Tipo</th><th>Edificio</th><th>Capacidad</th><th>Horario</th><th>Estado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody id="tabla"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/sesion.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/crud.js"></script>
  <script src="/js/salas.js"></script>
</body>
</html>
